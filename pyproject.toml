[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rw_blueprint"
version = "0.2.0"
description = "Declarative infrastructure source-of-truth engine: YAML topology -> generated diagrams, docs, and IaC skeletons. Includes live-state probes and drift reconciliation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RapidWebs" }]
keywords = ["infrastructure", "topology", "source-of-truth", "diagram-as-code", "iac", "yaml", "drift-detection", "reconciliation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pytest-randomly>=3.15",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.16",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
rw-blueprint = "rw_blueprint.cli:app"
rw-blueprint-mcp = "rw_blueprint.mcp_server:run"

[tool.setuptools.packages.find]
where = ["src"]

# --- pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--tb=short",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
    "smoke: critical-path smoke tests",
]

# --- coverage ---
[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]

# --- ruff (lint + format) ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- mypy ---
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
pretty = true